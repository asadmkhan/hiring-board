[project]
name = "hiring-board-backend"
version = "0.1.0"
description = "API for the hiring board"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
